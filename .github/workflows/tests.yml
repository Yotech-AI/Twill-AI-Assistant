name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        mcp: ['0.5', '0.9']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / mcp ${{ matrix.mcp }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ext-gd is required by the media-ingestion tests, ext-openssl by the
          # Passport keypair the MCP suite generates for itself.
          extensions: mbstring, gd, openssl, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction --dev \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${{ matrix.testbench }}.0" \
            "laravel/mcp:^${{ matrix.mcp }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --no-coverage

  # The quiz-cms shape: a host that wants the admin assistant but never installed
  # the connector. Proves the MCP gate leaves the package fully working when
  # laravel/mcp and laravel/passport are simply absent — the half of the gate
  # class_exists() makes untestable from inside the suite.
  test-without-mcp:
    runs-on: ubuntu-latest
    name: PHP 8.4 / Laravel 13 / no mcp, no passport

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, openssl, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies without the connector
        run: |
          composer remove --no-update --no-interaction --dev laravel/mcp laravel/passport
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run every suite except the connector
        run: vendor/bin/pest --no-coverage --testsuite=Package,TwillAi,Seo

  # The mirror image: a host that runs the SEO Suite but never installed the
  # connector is the common shape, so the two optional dependencies are proven
  # to compose rather than only to work one at a time.
  test-without-seo:
    runs-on: ubuntu-latest
    name: PHP 8.4 / Laravel 13 / no SEO Suite

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, openssl, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies without the SEO Suite
        run: |
          composer remove --no-update --no-interaction --dev yotech-ai/twill-cms-seo-suite
          composer update --prefer-dist --no-interaction --no-progress

      # Every suite except Seo, which tests the bridge against the real Suite.
      # The SEO tool COUNTS still run here, in Mcp and TwillAi, driven by the
      # fake bridge -- so "adds exactly three tools" is asserted on a machine
      # where the Suite does not exist.
      - name: Run every suite except SEO
        run: vendor/bin/pest --no-coverage --testsuite=Package,TwillAi,Mcp

  pint:
    runs-on: ubuntu-latest
    name: code style

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
