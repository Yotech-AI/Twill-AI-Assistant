name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# The package is checked out into a subdirectory rather than the workspace root,
# because composer.json resolves yotech-ai/twill-plugin-support through a path
# repository at ../twill-plugin-support and actions/checkout refuses any path
# above the workspace. Both checkouts therefore sit side by side under it.
defaults:
  run:
    working-directory: package

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        mcp: ['0.5', '0.9']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / mcp ${{ matrix.mcp }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      # Drop this once twill-plugin-support is on Packagist, along with the
      # `repositories` entry in composer.json.
      - name: Check out twill-plugin-support
        uses: actions/checkout@v4
        with:
          repository: Yotech-AI/twill-plugin-support
          path: twill-plugin-support
          ref: v1.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ext-gd is required by the media-ingestion tests, ext-openssl by the
          # Passport keypair the MCP suite generates for itself.
          extensions: mbstring, gd, openssl, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction --dev \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${{ matrix.testbench }}.0" \
            "laravel/mcp:^${{ matrix.mcp }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --no-coverage

  # The quiz-cms shape: a host that wants the admin assistant but never installed
  # the connector. Proves the MCP gate leaves the package fully working when
  # laravel/mcp and laravel/passport are simply absent — the half of the gate
  # class_exists() makes untestable from inside the suite.
  test-without-mcp:
    runs-on: ubuntu-latest
    name: PHP 8.4 / Laravel 13 / no mcp, no passport

    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Check out twill-plugin-support
        uses: actions/checkout@v4
        with:
          repository: Yotech-AI/twill-plugin-support
          path: twill-plugin-support
          ref: v1.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, openssl, sqlite3, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies without the connector
        run: |
          composer remove --no-update --no-interaction --dev laravel/mcp laravel/passport
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests, excluding the connector suite
        run: vendor/bin/pest --no-coverage --testsuite=Unit,FeatureWithoutMcp

  pint:
    runs-on: ubuntu-latest
    name: code style

    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Check out twill-plugin-support
        uses: actions/checkout@v4
        with:
          repository: Yotech-AI/twill-plugin-support
          path: twill-plugin-support
          ref: v1.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
